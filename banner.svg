<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Quixilir</title>
  <desc id="d">Hardware, embedded systems and security, drawn as a chip with PCB traces and moving signal pulses.</desc>
  <style>
    .trace { fill: none; stroke: #14452a; stroke-width: 2; stroke-linejoin: miter; }
    .pulse { fill: none; stroke: #3dff8b; stroke-width: 2.5; stroke-dasharray: 5 95; stroke-dashoffset: 5; animation: run 4s linear infinite; }
    .via   { fill: #000; stroke: #14452a; stroke-width: 2; }
    @keyframes run { from { stroke-dashoffset: 5; } to { stroke-dashoffset: -95; } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; stroke-dasharray: 0 100; } }
    .name { font: 700 68px 'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace; fill: #ffffff; }
    .sub  { font: 400 22px 'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace; fill: #9aa3ad; }
    .chip { font: 700 34px 'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace; fill: #3dff8b; }
  </style>
  <rect width="1200" height="300" fill="#000"/>

  <!-- traces -->
  <g class="trace">
    <path d="M1000 110 H1060 V60 H1200"/>
    <path d="M1000 130 H1120 V95 H1200"/>
    <path d="M1000 150 H1200"/>
    <path d="M1000 170 H1090 V205 H1200"/>
    <path d="M1000 190 H1050 V250 H1200"/>
    <path d="M910 90 V40 H760 V0"/>
    <path d="M940 90 V25 H1030 V0"/>
    <path d="M920 210 V262 H800 V300"/>
    <path d="M960 210 V300"/>
    <path d="M880 130 H800 V70 H740"/>
    <path d="M880 170 H820 V230 H700"/>
  </g>
  <circle class="via" cx="740" cy="70" r="5"/>
  <circle class="via" cx="700" cy="230" r="5"/>

  <!-- pulses: outbound from chip, inbound toward chip -->
  <g>
    <path class="pulse" pathLength="100" d="M1000 110 H1060 V60 H1200" style="animation-delay:0s"/>
    <path class="pulse" pathLength="100" d="M1000 130 H1120 V95 H1200" style="animation-delay:1.3s"/>
    <path class="pulse" pathLength="100" d="M1000 150 H1200" style="animation-delay:2.6s"/>
    <path class="pulse" pathLength="100" d="M1000 170 H1090 V205 H1200" style="animation-delay:0.7s"/>
    <path class="pulse" pathLength="100" d="M1000 190 H1050 V250 H1200" style="animation-delay:3.1s"/>
    <path class="pulse" pathLength="100" d="M910 90 V40 H760 V0" style="animation-delay:1.9s"/>
    <path class="pulse" pathLength="100" d="M960 210 V300" style="animation-delay:2.2s"/>
    <path class="pulse" pathLength="100" d="M740 70 H800 V130 H880" style="animation-delay:0.4s"/>
    <path class="pulse" pathLength="100" d="M700 230 H820 V170 H880" style="animation-delay:2.9s"/>
    <path class="pulse" pathLength="100" d="M1030 0 V25 H940 V90" style="animation-delay:1.6s"/>
    <path class="pulse" pathLength="100" d="M800 300 V262 H920 V210" style="animation-delay:3.4s"/>
  </g>

  <!-- chip -->
  <rect x="880" y="90" width="120" height="120" fill="#000" stroke="#3dff8b" stroke-width="2"/>
  <rect x="898" y="108" width="84" height="84" fill="none" stroke="#14452a" stroke-width="2"/>
  <circle cx="893" cy="103" r="3" fill="#3dff8b"/>
  <text class="chip" x="940" y="163" text-anchor="middle">Q</text>

  <!-- text -->
  <text class="name" x="60" y="150">Quixilir</text>
  <text class="sub" x="62" y="196">Hardware, embedded systems, security.</text>
</svg>
